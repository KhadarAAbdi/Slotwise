name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SLOTWISE_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Slotwise_Test_1;TrustServerCertificate=True;"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Slotwise_Test_1"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          for proj in $(find . -name "*.csproj"); do
            dotnet build "$proj" --configuration Release
          done

      - name: Test
        run: |
          for proj in $(find . -name "*.Tests.csproj"); do
            dotnet test "$proj" --configuration Release --no-build --collect:"XPlat Code Coverage"
          done

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/TestResults/**/coverage.cobertura.xml"
